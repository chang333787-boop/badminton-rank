<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 배드민턴 복식 대진표</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --win: #16a34a;
      --lose: #dc2626;
      --wait: #fef3c7;
      --wait-line: #f59e0b;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      border-radius: 26px;
      padding: 26px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -0.04em;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 15px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      color: var(--ink);
      background: #eef2ff;
      transition: transform 0.08s ease, filter 0.1s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn-win-left,
    .btn-win-right {
      background: #dcfce7;
      color: #166534;
      min-width: 100px;
    }

    .btn-clear {
      background: #f3f4f6;
      color: #374151;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .summary-card .value {
      font-size: 28px;
      font-weight: 900;
      margin-top: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      align-items: start;
    }

    .round {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .round-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .round h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .round-status {
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
    }

    .court-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .match {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: #fbfdff;
    }

    .court-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 900;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 9px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .team {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 12px 10px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      word-break: keep-all;
    }

    .team.winner {
      border-color: #86efac;
      background: #f0fdf4;
      color: #14532d;
    }

    .team.loser {
      opacity: 0.58;
    }

    .vs {
      color: var(--muted);
      font-size: 20px;
      font-weight: 900;
    }

    .match-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .wait-box {
      margin-top: 12px;
      border: 1px solid #fde68a;
      background: var(--wait);
      border-left: 6px solid var(--wait-line);
      border-radius: 16px;
      padding: 12px;
    }

    .wait-title {
      font-weight: 900;
      margin-bottom: 6px;
      color: #92400e;
    }

    .wait-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      background: white;
      border: 1px solid rgba(146, 64, 14, 0.18);
      font-weight: 800;
      font-size: 13px;
    }

    .side {
      position: sticky;
      top: 14px;
    }

    .standings {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .standings h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      overflow: hidden;
      border-radius: 14px;
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      background: #f9fafb;
    }

    td.name {
      text-align: left;
      font-weight: 900;
    }

    .rank {
      font-weight: 900;
      color: var(--accent);
    }

    .score-plus { color: var(--win); font-weight: 900; }
    .score-minus { color: var(--lose); font-weight: 900; }
    .score-zero { color: var(--muted); font-weight: 900; }

    .note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    .mini {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .mini h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .mini ul {
      margin: 8px 0 0 18px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .completed-badge {
      display: inline-flex;
      align-items: center;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 900;
    }

    .empty-badge {
      display: inline-flex;
      align-items: center;
      background: #f3f4f6;
      color: #6b7280;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 12px 10px 60px;
      }

      header {
        border-radius: 20px;
        padding: 20px 16px;
      }

      .court-grid {
        grid-template-columns: 1fr;
      }

      .teams {
        grid-template-columns: 1fr;
      }

      .vs {
        text-align: center;
        font-size: 16px;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .summary-card {
        padding: 12px;
      }

      .summary-card .value {
        font-size: 22px;
      }

      th, td {
        padding: 7px 4px;
        font-size: 13px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .page {
        max-width: none;
        padding: 0;
      }

      header, .summary-card, .round, .standings, .mini {
        box-shadow: none;
      }

      .top-actions, .match-actions {
        display: none !important;
      }

      .layout {
        display: block;
      }

      .side {
        position: static;
      }

      .round {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>오늘 배드민턴 복식 대진표</h1>
      <p>오늘 경기 전용 · 승리 +3점 / 패배 -3점 · 전원 5경기 출전</p>
    </header>

    <div class="top-actions">
      <button class="btn-primary" onclick="window.print()">인쇄하기</button>
      <button onclick="scrollToStandings()">오늘 순위 보기</button>
      <button class="btn-danger" onclick="resetAll()">오늘 기록 초기화</button>
    </div>

    <section class="summary-grid" aria-label="경기 요약">
      <div class="summary-card">
        <div class="label">총 라운드</div>
        <div class="value">10</div>
      </div>
      <div class="summary-card">
        <div class="label">총 경기</div>
        <div class="value">20</div>
      </div>
      <div class="summary-card">
        <div class="label">개인별 출전</div>
        <div class="value">5</div>
      </div>
      <div class="summary-card">
        <div class="label">완료 경기</div>
        <div class="value" id="completedCount">0</div>
      </div>
    </section>

    <main class="layout">
      <section id="rounds"></section>

      <aside class="side">
        <section class="standings" id="standings">
          <h2>오늘 순위</h2>
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>이름</th>
                <th>점수</th>
                <th>승</th>
                <th>패</th>
                <th>경기</th>
              </tr>
            </thead>
            <tbody id="standingsBody"></tbody>
          </table>
          <p class="note">동점 기준: 점수 → 승수 → 패수 적은 순 → 이름순</p>
        </section>

        <section class="mini">
          <h3>운영 방식</h3>
          <ul>
            <li>이긴 팀 2명은 각각 +3점</li>
            <li>진 팀 2명은 각각 -3점</li>
            <li>잘못 입력했으면 해당 경기의 ‘취소’ 버튼</li>
            <li>기록은 이 기기 브라우저에만 임시 저장됨</li>
          </ul>
        </section>
      </aside>
    </main>
  </div>

  <!-- 실시간 공유 저장소 (Firebase) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    window.FIREBASE_CONFIG = {
      databaseURL: "https://minton-e2c92-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "minton-e2c92"
    };
  </script>

  <script>
    const players = [
      "김성곤", "김형준", "조영재", "박지섭",
      "박강호", "양회욱", "주성모", "박희수",

      "김진호", "김예슬", "한지윤", "여현서"
    ];

    const rounds = [
      {
        round: 1,
        matches: [
          { court: "1코트", left: ["김성곤", "김형준"], right: ["조영재", "박지섭"] },
          { court: "2코트", left: ["박강호", "양회욱"], right: ["주성모", "박희수"] }
        ],
        wait: ["이태훈", "최서연", "이은미", "서민희", "김진호", "김예슬", "한지윤", "여현서"]
      },
      {
        round: 2,
        matches: [
          { court: "1코트", left: ["이태훈", "최서연"], right: ["김진호", "김예슬"] },
          { court: "2코트", left: ["이은미", "서민희"], right: ["한지윤", "여현서"] }
        ],
        wait: ["김성곤", "김형준", "조영재", "박지섭", "박강호", "양회욱", "주성모", "박희수"]
      },
      {
        round: 3,
        matches: [
          { court: "1코트", left: ["김성곤", "박강호"], right: ["조영재", "주성모"] },
          { court: "2코트", left: ["김형준", "양회욱"], right: ["박지섭", "김진호"] }
        ],
        wait: ["이태훈", "최서연", "이은미", "서민희", "박희수", "김예슬", "한지윤", "여현서"]
      },
      {
        round: 4,
        matches: [
          { court: "1코트", left: ["이태훈", "이은미"], right: ["박희수", "한지윤"] },
          { court: "2코트", left: ["최서연", "서민희"], right: ["김예슬", "여현서"] }
        ],
        wait: ["김성곤", "김형준", "조영재", "박지섭", "박강호", "양회욱", "주성모", "김진호"]
      },
      {
        round: 5,
        matches: [
          { court: "1코트", left: ["김성곤", "양회욱"], right: ["조영재", "박희수"] },
          { court: "2코트", left: ["김형준", "이태훈"], right: ["박지섭", "주성모"] }
        ],
        wait: ["박강호", "최서연", "이은미", "서민희", "김진호", "김예슬", "한지윤", "여현서"]
      },
      {
        round: 6,
        matches: [
          { court: "1코트", left: ["박강호", "이은미"], right: ["김진호", "한지윤"] },
          { court: "2코트", left: ["최서연", "서민희"], right: ["김예슬", "여현서"] }
        ],
        wait: ["김성곤", "김형준", "조영재", "박지섭", "양회욱", "주성모", "박희수", "이태훈"]
      },
      {
        round: 7,
        matches: [
          { court: "1코트", left: ["김성곤", "이태훈"], right: ["조영재", "김진호"] },
          { court: "2코트", left: ["김형준", "최서연"], right: ["박지섭", "박희수"] }
        ],
        wait: ["박강호", "양회욱", "주성모", "이은미", "서민희", "김예슬", "한지윤", "여현서"]
      },
      {
        round: 8,
        matches: [
          { court: "1코트", left: ["박강호", "이은미"], right: ["주성모", "김예슬"] },
          { court: "2코트", left: ["양회욱", "서민희"], right: ["한지윤", "여현서"] }
        ],
        wait: ["김성곤", "김형준", "조영재", "박지섭", "이태훈", "최서연", "박희수", "김진호"]
      },
      {
        round: 9,
        matches: [
          { court: "1코트", left: ["김성곤", "이은미"], right: ["조영재", "한지윤"] },
          { court: "2코트", left: ["김형준", "서민희"], right: ["박지섭", "여현서"] }
        ],
        wait: ["박강호", "양회욱", "주성모", "박희수", "이태훈", "최서연", "김진호", "김예슬"]
      },
      {
        round: 10,
        matches: [
          { court: "1코트", left: ["박강호", "최서연"], right: ["주성모", "김예슬"] },
          { court: "2코트", left: ["양회욱", "이태훈"], right: ["박희수", "김진호"] }
        ],
        wait: ["김성곤", "김형준", "조영재", "박지섭", "이은미", "서민희", "한지윤", "여현서"]
      }
    ];

    const storageKey = "badminton-today-results-v1";
    let results = loadResults();

    function matchId(roundIndex, matchIndex) {
      return `r${roundIndex + 1}m${matchIndex + 1}`;
    }

    function loadResults() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch (error) {
        return {};
      }
    }

    function saveResults() {
      localStorage.setItem(storageKey, JSON.stringify(results));
      saveCloud();
    }

    let cloudRef = null;

    function cloudReady() {
      const cfg = window.FIREBASE_CONFIG;
      return (
        typeof firebase !== "undefined" &&
        cfg &&
        typeof cfg.databaseURL === "string" &&
        cfg.databaseURL.startsWith("http")
      );
    }

    function initCloud() {
      if (!cloudReady()) {
        console.info("로컬 저장 모드 (Firebase 설정 없음)");
        return;
      }
      try {
        firebase.initializeApp(window.FIREBASE_CONFIG);
        cloudRef = firebase.database().ref(storageKey);
        cloudRef.on("value", (snapshot) => {
          const data = snapshot.val();
          results =
            data && typeof data === "object" && !Array.isArray(data) ? data : {};
          try {
            localStorage.setItem(storageKey, JSON.stringify(results));
          } catch (error) {
            /* 캐시 저장 실패는 무시 */
          }
          render();
        });
      } catch (error) {
        console.error("실시간 공유 연결 실패:", error);
        cloudRef = null;
      }
    }

    function saveCloud() {
      if (!cloudRef) return;
      cloudRef.set(results).catch((error) => {
        console.error("실시간 저장 실패:", error);
      });
    }

    function teamText(team) {
      return `${team[0]} + ${team[1]}`;
    }

    function renderRounds() {
      const container = document.getElementById("rounds");

      container.innerHTML = rounds.map((round, roundIndex) => {
        const completedInRound = round.matches.filter((_, matchIndex) => results[matchId(roundIndex, matchIndex)]).length;
        const statusBadge = completedInRound === round.matches.length
          ? `<span class="completed-badge">완료</span>`
          : `<span class="empty-badge">${completedInRound}/${round.matches.length}</span>`;

        const matchHtml = round.matches.map((match, matchIndex) => {
          const id = matchId(roundIndex, matchIndex);
          const result = results[id];
          const leftClass = result === "left" ? "winner" : result === "right" ? "loser" : "";
          const rightClass = result === "right" ? "winner" : result === "left" ? "loser" : "";

          return `
            <article class="match">
              <div class="court-name">${match.court}</div>
              <div class="teams">
                <div class="team ${leftClass}">${teamText(match.left)}</div>
                <div class="vs">VS</div>
                <div class="team ${rightClass}">${teamText(match.right)}</div>
              </div>
              <div class="match-actions">
                <button class="btn-win-left" onclick="setResult('${id}', 'left')">왼쪽 승</button>
                <button class="btn-win-right" onclick="setResult('${id}', 'right')">오른쪽 승</button>
                <button class="btn-clear" onclick="clearResult('${id}')">취소</button>
              </div>
            </article>
          `;
        }).join("");

        const waitHtml = round.wait.map(name => `<span class="chip">${name}</span>`).join("");

        return `
          <section class="round">
            <div class="round-head">
              <h2>${round.round}라운드</h2>
              <div class="round-status">${statusBadge}</div>
            </div>
            <div class="court-grid">${matchHtml}</div>
            <div class="wait-box">
              <div class="wait-title">대기</div>
              <div class="wait-list">${waitHtml}</div>
            </div>
          </section>
        `;
      }).join("");
    }

    function calculateStandings() {
      const table = {};
      players.forEach(name => {
        table[name] = { name, score: 0, wins: 0, losses: 0, games: 0 };
      });

      rounds.forEach((round, roundIndex) => {
        round.matches.forEach((match, matchIndex) => {
          const result = results[matchId(roundIndex, matchIndex)];
          if (!result) return;

          const winners = result === "left" ? match.left : match.right;
          const losers = result === "left" ? match.right : match.left;

          winners.forEach(name => {
            table[name].score += 3;
            table[name].wins += 1;
            table[name].games += 1;
          });

          losers.forEach(name => {
            table[name].score -= 3;
            table[name].losses += 1;
            table[name].games += 1;
          });
        });
      });

      return Object.values(table).sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (b.wins !== a.wins) return b.wins - a.wins;
        if (a.losses !== b.losses) return a.losses - b.losses;
        return a.name.localeCompare(b.name, "ko");
      });
    }

    function renderStandings() {
      const tbody = document.getElementById("standingsBody");
      const standings = calculateStandings();

      let lastScore = null;
      let lastWins = null;
      let lastLosses = null;
      let rank = 0;
      let shownRank = 0;

      tbody.innerHTML = standings.map((row) => {
        rank += 1;
        const sameAsAbove = row.score === lastScore && row.wins === lastWins && row.losses === lastLosses;
        if (!sameAsAbove) shownRank = rank;
        lastScore = row.score;
        lastWins = row.wins;
        lastLosses = row.losses;

        const scoreClass = row.score > 0 ? "score-plus" : row.score < 0 ? "score-minus" : "score-zero";
        const scoreText = row.score > 0 ? `+${row.score}` : `${row.score}`;

        return `
          <tr>
            <td class="rank">${shownRank}</td>
            <td class="name">${row.name}</td>
            <td class="${scoreClass}">${scoreText}</td>
            <td>${row.wins}</td>
            <td>${row.losses}</td>
            <td>${row.games}</td>
          </tr>
        `;
      }).join("");
    }

    function renderCompletedCount() {
      const count = Object.keys(results).filter(key => results[key]).length;
      document.getElementById("completedCount").textContent = count;
    }

    function setResult(id, side) {
      results[id] = side;
      saveResults();
      render();
    }

    function clearResult(id) {
      delete results[id];
      saveResults();
      render();
    }

    function resetAll() {
      const ok = confirm("오늘 입력한 승패 기록을 전부 지울까요?");
      if (!ok) return;
      results = {};
      saveResults();
      render();
    }

    function scrollToStandings() {
      document.getElementById("standings").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function render() {
      renderRounds();
      renderStandings();
      renderCompletedCount();
    }

    render();
    initCloud();
  </script>
</body>
</html>
