<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>배드민턴 대진표 (2026-07-22)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "맑은 고딕","Malgun Gothic",sans-serif; margin: 20px; color:#1a2233; background:#f4f6fb; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color:#67708a; font-size:13px; margin-bottom:16px; }
  .wrap { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .court { background:#fff; border:1px solid #d5dbe8; border-radius:10px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .court h2 { text-align:center; font-size:16px; margin:0 0 10px; padding:6px 0; border:2px solid #2f3b52; border-radius:6px; }
  table { border-collapse:collapse; }
  td { padding:5px 8px; font-size:14px; white-space:nowrap; }
  .team { border:1px solid #cfd6e4; border-radius:5px; padding:5px 10px; text-align:center; min-width:118px; }
  .cbx { width:20px; height:20px; cursor:pointer; }
  .mid { color:#9aa3b8; font-weight:700; padding:0 4px; }
  .cnt-row td { padding-top:8px; font-weight:700; font-size:15px; color:#2f6fd6; text-align:center; }
  .roster { background:#fff; border:1px solid #d5dbe8; border-radius:10px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .roster h3 { margin:0 0 8px; font-size:14px; text-align:center; }
  .roster .name { border:1px solid #cfd6e4; border-radius:5px; padding:5px 12px; margin:4px 0; font-size:14px; text-align:center; }
  .roster.left .name { background:#cfe0f6; }
  .note { margin-top:18px; font-size:12px; color:#8a93a8; max-width:640px; line-height:1.6; }
  @media print { body{background:#fff;margin:6mm;} .court,.roster{box-shadow:none;} }
</style>

<h1>🏸 배드민턴 대진표</h1>
<div class="sub">2026-07-22 · 왼쪽 그룹(파랑) vs 오른쪽 그룹 · 체크하면 아래 점수 자동 집계</div>

<div class="wrap">
  <div class="roster left"><h3>명단 A</h3><div id="rosterA"></div></div>

  <div class="court"><h2>6코트</h2><table id="court6"></table></div>
  <div class="court"><h2>5코트</h2><table id="court5"></table></div>

  <div class="roster"><h3>명단 B</h3><div id="rosterB"></div></div>
</div>

<p class="note">
  ※ 용현정 동명2인 → 명단A는 <b>용현정a</b>, 명단B는 <b>용현정b</b>로 표기.<br>
  ※ 참고: 원본 이미지에서 대진 경기엔 <b>김진호</b>가 들어가 있는데 명단B 칸엔 <b>용현정b</b>가 적혀 있어요(김진호 없음). 이미지 그대로 옮겼으니 둘 중 실제 맞는 이름으로 칸을 눌러 바로 고치면 됩니다.<br>
  ※ 이름 칸은 눌러서 즉시 수정 가능(명단만 빠르게 교체용).
</p>

<script>
const court6 = [
 ["김성곤","최신웅","조영재","박지섭"],
 ["김성곤","박강호","조영재","주성모"],
 ["최신웅","박강호","박지섭","주성모"],
 ["여원미","박복균","양회욱","김진호"],
 ["여원미","용현정a","박희수","김예슬"],
 ["한지윤","박강호","양회욱","박희수"],
 ["박복균","용현정a","김진호","이은미"],
 ["박복균","서민희","양회욱","이민석"],
 ["한지윤","서민희","이은미","이민석"],
 ["용현정a","서민희","김예슬","이민석"],
];
const court5 = [
 ["김성곤","최신웅","조영재","박지섭"],
 ["김성곤","박강호","조영재","주성모"],
 ["최신웅","박강호","박지섭","주성모"],
 ["박복균","용현정a","박희수","김진호"],
 ["용현정a","한지윤","이은미","박희수"],
 ["한지윤","서민희","이은미","이민석"],
 ["김진호","박복균","여원미","양회욱"],
 ["여원미","주성모","박희수","박지섭"],
 ["김성곤","한지윤","조영재","김예슬"],
 ["최신웅","박희수","주성모","박강호"],
];
const rosterA = ["김성곤","최신웅","박강호","여원미","박복균","용현정a","한지윤","서민희"];
const rosterB = ["조영재","박지섭","주성모","양회욱","박희수","김예슬","용현정b","이은미","이민석"];

function buildCourt(id, data){
  const t = document.getElementById(id);
  data.forEach(m=>{
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><input type="checkbox" class="cbx a"></td>`+
      `<td class="team" contenteditable>${m[0]} · ${m[1]}</td>`+
      `<td class="mid">:</td>`+
      `<td class="team" contenteditable>${m[2]} · ${m[3]}</td>`+
      `<td><input type="checkbox" class="cbx b"></td>`;
    t.appendChild(tr);
  });
  const tr = document.createElement("tr");
  tr.className="cnt-row";
  tr.innerHTML = `<td class="ca">0</td><td></td><td></td><td></td><td class="cb">0</td>`;
  t.appendChild(tr);
  t.addEventListener("change", ()=>{
    t.querySelector(".ca").textContent = t.querySelectorAll(".a:checked").length;
    t.querySelector(".cb").textContent = t.querySelectorAll(".b:checked").length;
  });
}
function buildRoster(id, names){
  const c = document.getElementById(id);
  names.forEach(n=>{ const d=document.createElement("div"); d.className="name"; d.contentEditable=true; d.textContent=n; c.appendChild(d); });
}
buildCourt("court6", court6);
buildCourt("court5", court5);
buildRoster("rosterA", rosterA);
buildRoster("rosterB", rosterB);
</script>
