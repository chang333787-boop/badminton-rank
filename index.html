<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>오늘의 배드민턴 순위표 v4</title>
<style>
:root {
  --bg:#f4f7fb;
  --card:#ffffff;
  --ink:#172033;
  --muted:#64748b;
  --line:#e2e8f0;
  --blue:#2563eb;
  --blue2:#dbeafe;
  --green:#16a34a;
  --green2:#dcfce7;
  --red:#dc2626;
  --red2:#fee2e2;
  --amber:#f59e0b;
  --amber2:#fef3c7;
  --shadow:0 12px 28px rgba(15,23,42,.08);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:linear-gradient(180deg,#eaf2ff 0,#f8fafc 260px,var(--bg));
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input { font-family:inherit; }
button {
  border:0;
  border-radius:999px;
  min-height:42px;
  padding:10px 14px;
  font-weight:900;
  background:#eef2ff;
  color:#1e3a8a;
  cursor:pointer;
  touch-action:manipulation;
}
button:active { transform:scale(.985); }
input {
  width:100%;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px 8px;
  background:#fff;
  color:var(--ink);
  font-size:22px;
  font-weight:950;
  text-align:center;
}
input:focus { outline:3px solid rgba(37,99,235,.18); border-color:var(--blue); }
.app {
  max-width:1180px;
  margin:0 auto;
  padding:14px 12px calc(90px + var(--safe-bottom));
}
.hero {
  background:linear-gradient(135deg,#1d4ed8,#38bdf8);
  color:#fff;
  border-radius:28px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.hero h1 {
  margin:0 0 6px;
  font-size:clamp(26px,4vw,42px);
  letter-spacing:-.05em;
}
.hero p { margin:0; opacity:.94; font-weight:800; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.between { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.grid { display:grid; gap:12px; }
.grid4 { grid-template-columns:repeat(4,1fr); }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; align-items:start; }
.side { position:sticky; top:10px; }
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.card h2,.card h3 { margin:0 0 10px; letter-spacing:-.04em; }
.metric {
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
}
.metric .label { color:var(--muted); font-size:12px; font-weight:950; }
.metric .value { font-size:27px; font-weight:950; letter-spacing:-.04em; }
.muted { color:var(--muted); }
.tiny { color:var(--muted); font-size:12px; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-red { background:var(--red2); color:#991b1b; }
.btn-green { background:var(--green2); color:#166534; }
.btn-amber { background:var(--amber2); color:#92400e; }
.pill {
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:950;
  background:#f1f5f9;
  color:#475569;
}
.pill.ok { background:var(--green2); color:#166534; }
.pill.wait { background:#f1f5f9; color:#64748b; }
.pill.err { background:var(--red2); color:#991b1b; }
.round-card {
  border:1px solid var(--line);
  border-radius:24px;
  background:#fff;
  box-shadow:var(--shadow);
  margin-bottom:12px;
  overflow:hidden;
}
.round-head {
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:#f8fafc;
  border-bottom:1px solid var(--line);
}
.round-head h2 { margin:0; font-size:20px; }
.court-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
}
.match {
  padding:14px;
  border-right:1px solid var(--line);
}
.match:last-child { border-right:0; }
.match-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.court {
  font-weight:950;
  color:#1e40af;
  background:var(--blue2);
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
}
.teams {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:9px;
  align-items:stretch;
}
.team {
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  background:#fff;
  display:grid;
  gap:8px;
}
.team.win {
  background:#f0fdf4;
  border-color:#86efac;
  color:#14532d;
}
.team.lose { opacity:.62; }
.team-name {
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:950;
  line-height:1.35;
  word-break:keep-all;
}
.vs {
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
  color:var(--muted);
  font-size:18px;
}
.score-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.result-msg {
  margin-top:9px;
  min-height:22px;
  font-size:13px;
  font-weight:900;
  color:var(--muted);
}
.result-msg.ok { color:#166534; }
.result-msg.err { color:#991b1b; }
.table-wrap {
  overflow:auto;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
}
table {
  width:100%;
  border-collapse:collapse;
  min-width:680px;
}
th,td {
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  text-align:center;
  white-space:nowrap;
  font-size:13px;
}
th {
  background:#f8fafc;
  color:#64748b;
  font-size:12px;
  position:sticky;
  top:0;
}
tr:last-child td { border-bottom:0; }
td.left { text-align:left; font-weight:950; }
.rank { color:var(--blue); font-weight:950; }
.plus { color:var(--green); font-weight:950; }
.minus { color:var(--red); font-weight:950; }
.zero { color:var(--muted); font-weight:950; }
.notice {
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1e40af;
  border-radius:18px;
  padding:12px;
  font-size:13px;
  font-weight:850;
}
.mobile-bottom {
  display:none;
}
@media(max-width:960px) {
  .layout { grid-template-columns:1fr; }
  .side { position:static; }
  .grid4 { grid-template-columns:1fr 1fr; }
}
@media(max-width:660px) {
  .app { padding:10px 9px calc(86px + var(--safe-bottom)); }
  .hero { border-radius:23px; padding:18px; }
  .card,.round-card { border-radius:21px; }
  .court-grid { grid-template-columns:1fr; }
  .match { border-right:0; border-bottom:1px solid var(--line); }
  .match:last-child { border-bottom:0; }
  .teams { grid-template-columns:1fr; gap:7px; }
  .vs { font-size:13px; min-height:16px; }
  .team {
    grid-template-columns:1fr 76px;
    align-items:center;
  }
  .team-name {
    justify-content:flex-start;
    text-align:left;
    min-height:0;
  }
  input { font-size:20px; }
  .mobile-bottom {
    position:fixed;
    left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:10px 10px calc(10px + var(--safe-bottom));
    background:rgba(255,255,255,.92);
    border-top:1px solid var(--line);
    backdrop-filter:blur(10px);
    z-index:50;
  }
}
@media print {
  body { background:#fff; }
  .hero button,.mobile-bottom,.no-print { display:none!important; }
  .app { max-width:none; padding:0; }
  .hero,.card,.round-card,.metric { box-shadow:none; }
  .layout { grid-template-columns:1fr; }
  .side { position:static; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="between">
      <div>
        <h1>🏸 오늘의 배드민턴 순위표</h1>
        <p>10라운드 · 2코트 · 총 20경기 · 입력 순서 고정 · 승수/득실 중심 순위</p>
      </div>
      <div class="row no-print">
        <button class="btn-green" id="printBtn">인쇄</button>
        <button class="btn-red" id="resetBtn">기록 초기화</button>
      </div>
    </div>
  </header>

  <section class="grid grid4" id="metrics"></section>

  <section class="layout">
    <main id="schedule"></main>
    <aside class="side">
      <div class="card">
        <div class="between">
          <h2>오늘 순위</h2>
          <span class="pill" id="rankStatus">대기</span>
        </div>
        <div id="ranking"></div>
      </div>
      <div class="card">
        <h2>순위 기준</h2>
        <div class="notice">
          전원 5경기 기준이라 순위는 승수 중심<br>
          동점 기준: 승수 → 득실 → 득점 → 실점 적은 순 → 이름순
        </div>
        <p class="tiny">점수는 양쪽을 입력하면 바로 승패가 계산됩니다. 동점은 반영하지 않습니다.</p>
      </div>
    </aside>
  </section>
</div>

<nav class="mobile-bottom no-print">
  <button class="btn-primary" id="nextEmptyBtn">다음 미입력</button>
  <button id="rankingBtn">순위 보기</button>
</nav>

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  let scores = loadScores();

  function loadScores(){
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch(e) {
      return {};
    }
  }

  function saveScores(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }

  // ===== 실시간 공유 (Firebase Realtime Database) =====
  let cloudRef = null;

  function cloudReady(){
    const cfg = window.FIREBASE_CONFIG;
    return (
      typeof firebase !== "undefined" &&
      cfg &&
      typeof cfg.databaseURL === "string" &&
      cfg.databaseURL.startsWith("http")
    );
  }

  function initCloud(){
    if(!cloudReady()){
      console.info("로컬 저장 모드 (Firebase 설정 없음)");
      return;
    }
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      cloudRef = firebase.database().ref(STORAGE_KEY);
      cloudRef.on("value", (snapshot) => {
        const data = snapshot.val();
        scores = (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch(e) { /* 캐시 실패 무시 */ }

        // 점수 입력칸에 타이핑 중이면 카드를 다시 그리지 않고, 포커스 중인 칸만 빼고
        // 값/승패 표시만 갱신해 커서를 보존한다.
        const active = document.activeElement;
        const typing = active && active.dataset && active.dataset.match;
        if(typing){
          MATCHES.forEach(m => {
            const sc = getScore(m.id);
            const inA = document.querySelector(`input[data-match="${m.id}"][data-side="a"]`);
            const inB = document.querySelector(`input[data-match="${m.id}"][data-side="b"]`);
            if(inA && inA !== active) inA.value = sc.a ?? "";
            if(inB && inB !== active) inB.value = sc.b ?? "";
            updateMatchVisual(m.id);
          });
          renderMetrics();
          renderRanking();
        } else {
          render();
        }
      });
    } catch(error){
      console.error("실시간 공유 연결 실패:", error);
      cloudRef = null;
    }
  }

  function pushCloud(){
    if(!cloudRef) return;
    cloudRef.set(scores).catch((error) => {
      console.error("실시간 저장 실패:", error);
    });
  }

  function allPlayers(){
    const set = new Set();
    MATCHES.forEach(m => {
      m.teamA.concat(m.teamB).forEach(p => set.add(p));
    });
    return Array.from(set).sort((a,b)=>a.localeCompare(b,"ko"));
  }

  function teamText(team) {
    return team.join(" + ");
  }

  function getScore(matchId){
    return scores[matchId] || {a:"", b:""};
  }

  function parseWinner(sc){
    const a = Number(sc.a);
    const b = Number(sc.b);
    if(sc.a === "" || sc.b === "" || sc.a === null || sc.b === null) return null;
    if(!Number.isFinite(a) || !Number.isFinite(b)) return null;
    if(a === b) return "TIE";
    return a > b ? "A" : "B";
  }

  function render(){
    renderMetrics();
    renderSchedule();
    renderRanking();
    saveScores();
  }

  function renderMetrics(){
    const completed = MATCHES.filter(m => {
      const w = parseWinner(getScore(m.id));
      return w === "A" || w === "B";
    }).length;
    const total = MATCHES.length;
    const players = allPlayers().length;
    const remaining = total - completed;
    $("#metrics").innerHTML = `
      <div class="metric"><div class="label">전체 경기</div><div class="value">${total}</div></div>
      <div class="metric"><div class="label">입력 완료</div><div class="value">${completed}</div></div>
      <div class="metric"><div class="label">남은 경기</div><div class="value">${remaining}</div></div>
      <div class="metric"><div class="label">참가자</div><div class="value">${players}</div></div>
    `;
  }

    const rounds = [];
    for(let i=0; i<MATCHES.length; i+=2) {
      rounds.push(MATCHES.slice(i,i+2));
    }

    $("#schedule").innerHTML = rounds.map(roundMatches => {
      const roundLabel = roundMatches[0].round;
      const done = roundMatches.filter(m => {
        const w = parseWinner(getScore(m.id));
        return w === "A" || w === "B";
      }).length;
      return `
        <section class="round-card">
          <div class="round-head">
            <h2>${roundLabel}</h2>
            <span class="pill ${done===2?"ok":"wait"}">${done}/2 완료</span>
          </div>
          <div class="court-grid">
            ${roundMatches.map(renderMatch).join("")}
          </div>
        </section>
      `;
    }).join("");
  }

  function renderMatch(m){
    const sc = getScore(m.id);
    const winner = parseWinner(sc);
    const aWin = winner === "A";
    const bWin = winner === "B";
    let msg = "점수를 입력하면 승패가 자동 반영됩니다.";
    let msgCls = "";
    if(winner === "TIE") {
      msg = "동점은 반영되지 않습니다. 점수를 다시 확인하세요.";
      msgCls = "err";
    } else if(aWin) {
      msg = `${teamText(m.teamA)} 승리`;
      msgCls = "ok";
    } else if(bWin) {
      msg = `${teamText(m.teamB)} 승리`;
      msgCls = "ok";
    }

    return `
      <article class="match" id="${m.id}">
        <div class="match-head">
          <span class="court">${m.court}</span>
          <span class="pill ${winner==="TIE"?"err":aWin||bWin?"ok":"wait"}">${winner==="TIE"?"동점 오류":aWin||bWin?"입력 완료":"대기"}</span>
        </div>
        <div class="teams">
          <div class="team ${aWin?"win":bWin?"lose":""}">
            <div class="team-name">${teamText(m.teamA)}</div>
            <input type="number" inputmode="numeric" min="0" max="99" value="${sc.a ?? ""}" data-match="${m.id}" data-side="a" placeholder="0">
          </div>
          <div class="vs">VS</div>
          <div class="team ${bWin?"win":aWin?"lose":""}">
            <div class="team-name">${teamText(m.teamB)}</div>
            <input type="number" inputmode="numeric" min="0" max="99" value="${sc.b ?? ""}" data-match="${m.id}" data-side="b" placeholder="0">
          </div>
        </div>
        <div class="result-msg ${msgCls}">${msg}</div>
      </article>
    `;
  }

  function buildStats(){
    const stats = {};
    allPlayers().forEach(name => {
      stats[name] = {
        name,
        games:0, wins:0, losses:0,
        points:0, pf:0, pa:0
      };
    });

    MATCHES.forEach(m => {
      const sc = getScore(m.id);
      const winner = parseWinner(sc);
      if(winner !== "A" && winner !== "B") return;

      const scoreA = Number(sc.a);
      const scoreB = Number(sc.b);
      const teamAWin = winner === "A";

      m.teamA.forEach(p => {
        stats[p].games += 1;
        stats[p].pf += scoreA;
        stats[p].pa += scoreB;
        if(teamAWin) {
          stats[p].wins += 1;
          stats[p].points += 3;
        } else {
          stats[p].losses += 1;
          stats[p].points -= 3;
        }
      });

      m.teamB.forEach(p => {
        stats[p].games += 1;
        stats[p].pf += scoreB;
        stats[p].pa += scoreA;
        if(!teamAWin) {
          stats[p].wins += 1;
          stats[p].points += 3;
        } else {
          stats[p].losses += 1;
          stats[p].points -= 3;
        }
      });
    });

    return Object.values(stats).sort((a,b) => {
      const ad = a.pf - a.pa;
      const bd = b.pf - b.pa;
      if(b.wins !== a.wins) return b.wins - a.wins;
      if(bd !== ad) return bd - ad;
      if(b.pf !== a.pf) return b.pf - a.pf;
      if(a.pa !== b.pa) return a.pa - b.pa;
      return a.name.localeCompare(b.name,"ko");
    });
  }

  function renderRanking(){
    const rows = buildStats();
    const completed = MATCHES.filter(m => {
      const w = parseWinner(getScore(m.id));
      return w === "A" || w === "B";
    }).length;
    $("#rankStatus").textContent = `${completed}/${MATCHES.length}경기`;
    $("#rankStatus").className = "pill " + (completed === MATCHES.length ? "ok" : "wait");

    $("#ranking").innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>승</th>
              <th>패</th>
              <th>득점</th>
              <th>실점</th>
              <th>득실</th>
              <th>경기</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r,idx) => {
              const diff = r.pf - r.pa;
              return `
                <tr>
                  <td class="rank">${idx+1}</td>
                  <td class="left">${r.name}</td>
                  <td class="plus">${r.wins}</td>
                  <td>${r.losses}</td>
                  <td>${r.pf}</td>
                  <td>${r.pa}</td>
                  <td class="${diff>0?"plus":diff<0?"minus":"zero"}">${diff>0?"+"+diff:diff}</td>
                  <td>${r.games}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function updateMatchVisual(matchId){
    const m = MATCHES.find(x => x.id === matchId);
    const card = document.getElementById(matchId);
    if(!m || !card) return;

    const sc = getScore(matchId);
    const winner = parseWinner(sc);
    const aWin = winner === "A";
    const bWin = winner === "B";

    const teams = card.querySelectorAll(".team");
    if(teams[0]){
      teams[0].classList.toggle("win", aWin);
      teams[0].classList.toggle("lose", bWin);
    }
    if(teams[1]){
      teams[1].classList.toggle("win", bWin);
      teams[1].classList.toggle("lose", aWin);
    }

    const pill = card.querySelector(".match-head .pill");
    if(pill){
      pill.className = "pill " + (winner === "TIE" ? "err" : (aWin || bWin) ? "ok" : "wait");
      pill.textContent = winner === "TIE" ? "동점 오류" : (aWin || bWin) ? "입력 완료" : "대기";
    }

    const msg = card.querySelector(".result-msg");
    if(msg){
      msg.className = "result-msg";
      if(winner === "TIE"){
        msg.textContent = "동점은 반영되지 않습니다. 점수를 다시 확인하세요.";
        msg.classList.add("err");
      }else if(aWin){
        msg.textContent = `${teamText(m.teamA)} 승리`;
        msg.classList.add("ok");
      }else if(bWin){
        msg.textContent = `${teamText(m.teamB)} 승리`;
        msg.classList.add("ok");
      }else{
        msg.textContent = "점수를 입력하면 승패가 자동 반영됩니다.";
      }
    }

    const roundCard = card.closest(".round-card");
    if(roundCard){
      const roundMatches = MATCHES.filter(x => x.round === m.round);
      const done = roundMatches.filter(x => {
        const w = parseWinner(getScore(x.id));
        return w === "A" || w === "B";
      }).length;
      const roundPill = roundCard.querySelector(".round-head .pill");
      if(roundPill){
        roundPill.textContent = `${done}/2 완료`;
        roundPill.className = "pill " + (done === 2 ? "ok" : "wait");
      }
    }
  }

  function updateAfterScoreInput(matchId){
    updateMatchVisual(matchId);
    renderMetrics();
    renderRanking();
    saveScores();
    pushCloud();
  }

  document.addEventListener("input", (e) => {
    const input = e.target.closest("input[data-match]");
    if(!input) return;

    const id = input.dataset.match;
    const side = input.dataset.side; // a = 왼쪽 팀, b = 오른쪽 팀
    scores[id] ||= {a:"", b:""};

    // 문자열 그대로 저장해야 12를 치는 중 21처럼 커서가 꼬이지 않음.
    const raw = input.value.replace(/[^\d]/g, "").slice(0, 2);
    input.value = raw;
    scores[id][side] = raw;

    updateAfterScoreInput(id);
  });

  $("#resetBtn").addEventListener("click", () => {
    if(confirm("오늘 입력한 점수를 모두 지울까요?")) {
      scores = {};
      saveScores();
      pushCloud();
      render();
    }
  });

  $("#printBtn").addEventListener("click", () => window.print());

  $("#rankingBtn").addEventListener("click", () => {
    document.querySelector(".side")?.scrollIntoView({behavior:"smooth", block:"start"});
  });

  $("#nextEmptyBtn").addEventListener("click", () => {
    const next = MATCHES.find(m => {
      const w = parseWinner(getScore(m.id));
      return w !== "A" && w !== "B";
    });
    if(next) {
      document.getElementById(next.id)?.scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(() => {
        document.querySelector(`input[data-match="${next.id}"][data-side="a"]`)?.focus();
      }, 350);
    } else {
      document.querySelector(".side")?.scrollIntoView({behavior:"smooth", block:"start"});
    }
  });

  render();
  initCloud();
})();
</script>
</body>
</html>
